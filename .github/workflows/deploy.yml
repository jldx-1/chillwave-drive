name: Chillwave Drive — build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - name: Verify downloaded LFS media
        run: git lfs fsck
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify game systems
        run: npm test
      - name: Build and check portable static game
        run: npm run build:pages
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify production gameplay and repository paths in Chromium
        run: npm run test:browser
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Explain blocked deployment
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          The build or browser checks failed, so this workflow has not deployed a new Pages artifact.
          Resolve the failing check and rerun this workflow. Browser screenshots, traces and error context are attached when available.
          Pages must use **Settings → Pages → Source → GitHub Actions**. A branch/root deployment serves src/main.ts as video/mp2t and misses public/favicon.svg.
          A successful deployment publishes only the compiled dist folder.
          SUMMARY
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build for this Pages URL
        if: github.event_name != 'pull_request'
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build:pages
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy compiled static game
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
